  centinela-neo4j:
    image: neo4j:5.12.0-community
    container_name: centinela-neo4j
    restart: always
    networks:
      - aura-network
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j-data:/data
    deploy:
      resources:
        limits:
          memory: 1G

  centinela-zeek:
    image: zeek/zeek:latest
    container_name: centinela-zeek
    restart: always
    networks:
      - aura-network
    cap_add:
      - NET_ADMIN
    volumes:
      - zeek-logs:/usr/local/zeek/logs
    command: zeek -i eth0
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  zap-cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=150m"
  neo4j-data:
  zeek-logs:

networks:
  aura-network:
    external: true
