version: '3.8'
services:
  centinela-ai:
    build: .
    container_name: centinela-ai
    restart: always
    networks:
    - aura-network
    volumes:
    - .:/app
    - ../core-casmarts:/app/core-casmarts:ro
    - ../consulta-smart/backend/app/core/credentials/google-v-credentials.json:/app/credentials.json:ro
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - VAULT_ADDR=http://casmarts-core-vault:8200
    - VAULT_TOKEN=${VAULT_TOKEN}
    - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - AI_PROVIDER=${AI_PROVIDER}
    - AI_MODEL=${AI_MODEL}
    - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
    - GCP_LOCATION=${GCP_LOCATION}
    - DB_HOST=casmarts-core-db-primary
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - VALKEY_HOST=casmarts-core-cache
    - AUTHENTIK_URL=https://auth.casmart.internal
    - AUTHENTIK_CLIENT_ID=centinela-ai
    - AUTHENTIK_INTERNAL_URL=http://casmarts-core-authentik-server:9000
    working_dir: /app
    command: python centinela.py
    deploy:
      resources:
        limits:
          memory: 2G
  centinela-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: centinela-backend
    restart: always
    networks:
    - aura-network
    volumes:
    - .:/app
    environment:
    - DB_HOST=casmarts-core-db-primary
    - DB_NAME=casmarts_security
    - DB_USER=admin
    - DB_PASSWORD=casmarts_secure_db_pwd_2026
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - VAULT_ADDR=http://casmarts-core-vault:8200
    - VAULT_TOKEN=${VAULT_TOKEN:-root}
    - AUTHENTIK_URL=https://auth.casmart.internal
    - AUTHENTIK_CLIENT_ID=centinela-ai
    - AUTHENTIK_INTERNAL_URL=http://casmarts-core-authentik-server:9000
    ports:
    - 8302:8000
    deploy:
      resources:
        limits:
          memory: 1G
  centinela-frontend:
    build:
      context: ./frontend
    container_name: centinela-frontend
    restart: always
    networks:
    - aura-network
    volumes:
    - ./frontend:/app
    - /app/node_modules
    ports:
    - 8301:5173
    depends_on:
    - centinela-backend
    deploy:
      resources:
        limits:
          memory: 512M
  centinela-sentinel:
    build: .
    container_name: centinela-sentinel
    restart: always
    networks:
    - aura-network
    volumes:
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - DB_HOST=casmarts-core-db-primary
    - DB_NAME=casmarts_security
    - DB_USER=admin
    - DB_PASSWORD=casmarts_secure_db_pwd_2026
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - VAULT_ADDR=http://casmarts-core-vault:8200
    - VAULT_TOKEN=${VAULT_TOKEN:-root}
    - ANSIBLE_REMOTE_USER=${ANSIBLE_REMOTE_USER:-pmcp}
    - ANSIBLE_BECOME_PASS=${ANSIBLE_BECOME_PASS:-}
    command: python sentinel.py
    depends_on:
    - centinela-ai
    deploy:
      resources:
        limits:
          memory: 1G
