services:
  centinela-ai:
    build: .
    container_name: centinela-ai
    restart: always
    cap_add:
    - SYS_PTRACE
    networks:
    - aura-network
    env_file:
    - .env
    volumes:
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    - zeek-logs:/app/logs/zeek:ro
    group_add:
    - "${DOCKER_GID:-136}"
    environment:
    - VAULT_ADDR=${VAULT_ADDR:-http://10.4.3.208:8200}
    - VAULT_TOKEN=${VAULT_TOKEN}
    - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - AI_PROVIDER=${AI_PROVIDER}
    - AI_MODEL=${AI_MODEL}
    - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
    - GCP_LOCATION=${GCP_LOCATION}
    - DB_HOST=${DB_HOST:-10.4.3.23}
    - DB_NAME=${DB_NAME:-centinela_db}
    - DB_USER=${DB_USER:-centinela_user}
    - DB_PASSWORD=${DB_PASSWORD:-centinela_sec_db_2026}
    - VALKEY_HOST=${VALKEY_HOST:-10.4.3.23}
    - AUTHENTIK_URL=${AUTHENTIK_URL:-https://auth.casmart.internal}
    - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-centinela-ai}
    - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
    - AUTHENTIK_INTERNAL_URL=${AUTHENTIK_INTERNAL_URL:-https://auth.casmart.internal}
    - GITLAB_URL=${GITLAB_URL:-http://10.4.3.10}
    - GITLAB_TOKEN=${GITLAB_TOKEN}
    - NEO4J_URI=bolt://centinela-neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=password
    working_dir: /app
    command: python centinela.py
    deploy:
      resources:
        limits:
          memory: 2G
  centinela-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: centinela-backend
    restart: always
    networks:
    - aura-network
    env_file:
    - .env
    volumes:
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    group_add:
    - "${DOCKER_GID:-136}"
    environment:
    - DB_HOST=${DB_HOST:-10.4.3.23}
    - DB_NAME=${DB_NAME:-centinela_db}
    - DB_USER=${DB_USER:-centinela_user}
    - DB_PASSWORD=${DB_PASSWORD:-centinela_sec_db_2026}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - VAULT_ADDR=${VAULT_ADDR:-http://10.4.3.208:8200}
    - VAULT_TOKEN=${VAULT_TOKEN}
    - AUTHENTIK_URL=${AUTHENTIK_URL:-https://auth.casmart.internal}
    - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-centinela-ai}
    - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
    - AUTHENTIK_INTERNAL_URL=${AUTHENTIK_INTERNAL_URL:-https://auth.casmart.internal}
    - NEO4J_URI=bolt://centinela-neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=password
    ports:
    - 8302:8000
    deploy:
      resources:
        limits:
          memory: 1G
  centinela-frontend:
    build:
      context: ./frontend
    container_name: centinela-frontend
    restart: always
    networks:
    - aura-network
    volumes:
    - ./frontend:/app
    - /app/node_modules
    ports:
    - 8301:5173
    depends_on:
    - centinela-backend
    deploy:
      resources:
        limits:
          memory: 512M
  centinela-sentinel:
    build: .
    container_name: centinela-sentinel
    restart: always
    networks:
    - aura-network
    env_file:
    - .env
    volumes:
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    group_add:
    - "${DOCKER_GID:-136}"
    environment:
    - DB_HOST=${DB_HOST:-10.4.3.23}
    - DB_NAME=${DB_NAME:-centinela_db}
    - DB_USER=${DB_USER:-centinela_user}
    - DB_PASSWORD=${DB_PASSWORD:-centinela_sec_db_2026}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - VAULT_ADDR=${VAULT_ADDR:-http://10.4.3.208:8200}
    - VAULT_TOKEN=${VAULT_TOKEN}
    - ANSIBLE_REMOTE_USER=${ANSIBLE_REMOTE_USER:-pmcp}
    - ANSIBLE_BECOME_PASS=${ANSIBLE_BECOME_PASS:-}
    command: python sentinel.py
    depends_on:
    - centinela-ai
    deploy:
      resources:
        limits:
          memory: 1G

