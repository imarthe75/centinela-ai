services:
  centinela-ai:
    build: .
    container_name: centinela-ai
    restart: always
    cap_add:
    - SYS_PTRACE
    networks:
    - aura-network
    env_file:
    - .env
    volumes:
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    - zeek-logs:/app/logs/zeek:ro
    group_add:
    - "${DOCKER_GID:-136}"
    environment:
    - VAULT_ADDR=${VAULT_ADDR:-http://10.4.3.208:8200}
    - VAULT_TOKEN=${VAULT_TOKEN}
    - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - AI_PROVIDER=${AI_PROVIDER}
    - AI_MODEL=${AI_MODEL}
    - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
    - GCP_LOCATION=${GCP_LOCATION}
    - DB_HOST=${DB_HOST:-10.4.3.23}
    - DB_NAME=${DB_NAME:-centinela_db}
    - DB_USER=${DB_USER:-centinela_user}
    - DB_PASSWORD=${DB_PASSWORD:-centinela_sec_db_2026}
    - VALKEY_HOST=${VALKEY_HOST:-10.4.3.23}
    - AUTHENTIK_URL=${AUTHENTIK_URL:-https://auth.casmart.internal}
    - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-centinela-ai}
    - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
    - AUTHENTIK_INTERNAL_URL=${AUTHENTIK_INTERNAL_URL:-https://auth.casmart.internal}
    - GITLAB_URL=${GITLAB_URL:-http://10.4.3.10}
    - GITLAB_TOKEN=${GITLAB_TOKEN}
    - SONAR_HOST_URL=${SONAR_HOST_URL:-http://centinela-sonarqube:9000}
    - SONAR_TOKEN=${SONAR_TOKEN}
    - HOST_PROJECT_ROOT=${HOST_PROJECT_ROOT:-/opt/centinela-ai}
    - NEO4J_URI=bolt://centinela-neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=password
    - CLICKHOUSE_HOST=centinela-clickhouse
    - CLICKHOUSE_USER=${CLICKHOUSE_USER}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    working_dir: /app
    command: python centinela.py
    deploy:
      resources:
        limits:
          memory: 2G
  centinela-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: centinela-backend
    restart: always
    networks:
    - aura-network
    env_file:
    - .env
    volumes:
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    group_add:
    - "${DOCKER_GID:-136}"
    environment:
    - DB_HOST=${DB_HOST:-10.4.3.23}
    - DB_NAME=${DB_NAME:-centinela_db}
    - DB_USER=${DB_USER:-centinela_user}
    - DB_PASSWORD=${DB_PASSWORD:-centinela_sec_db_2026}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - VAULT_ADDR=${VAULT_ADDR:-http://10.4.3.208:8200}
    - VAULT_TOKEN=${VAULT_TOKEN}
    - AUTHENTIK_URL=${AUTHENTIK_URL:-https://auth.casmart.internal}
    - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-centinela-ai}
    - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
    - AUTHENTIK_INTERNAL_URL=${AUTHENTIK_INTERNAL_URL:-https://auth.casmart.internal}
    # SONAR_* also live here (not just centinela-ai) because centinela-backend is where
    # requirements.txt installs pytest and tests/ actually runs from -- the live
    # SonarQube integration test in tests/test_auditor_sonarqube.py needs a real token to
    # exercise the real scan path. centinela-backend already has docker.sock mounted, so it
    # can spawn the sibling sonar-scanner container the same way centinela-ai does.
    - SONAR_HOST_URL=${SONAR_HOST_URL:-http://centinela-sonarqube:9000}
    - SONAR_TOKEN=${SONAR_TOKEN}
    - HOST_PROJECT_ROOT=${HOST_PROJECT_ROOT:-/opt/centinela-ai}
    - NEO4J_URI=bolt://centinela-neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=password
    - CLICKHOUSE_HOST=centinela-clickhouse
    - CLICKHOUSE_USER=${CLICKHOUSE_USER}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
    # Restricted to loopback 2026-08-14: this port was published on 0.0.0.0, reachable directly
    # from any network path to this host, bypassing nginx (and every TLS/security-header/rate
    # limit it provides) entirely. Confirmed live under active exploitation (command injection,
    # XSLT-SSRF RCE payloads hitting the raw dev server). Safe because centinela.casmart.internal
    # resolves directly to this host and nginx (host-level, /etc/nginx/sites-available/centinela)
    # listens on 0.0.0.0:443 and forwards via 127.0.0.1 -- so this does not affect any legitimate
    # traffic path, VPN included. NOT the same change as the reverted 2026-08-11 attempt below
    # (that one bound to a specific external interface IP, excluding the VPN's own interface;
    # loopback has no such exclusion since nginx always reaches it regardless of source interface).
    - 127.0.0.1:8302:8000
    deploy:
      resources:
        limits:
          memory: 1G
  centinela-frontend:
    build:
      context: ./frontend
    container_name: centinela-frontend
    restart: always
    networks:
    - aura-network
    volumes:
    - ./frontend:/app
    - /app/node_modules
    ports:
    # REVERTED 2026-08-11, RE-ATTEMPTED DIFFERENTLY 2026-08-14: the 08-11 attempt bound to the
    # host's specific external interface IP (10.4.3.34), which silently excluded VPN-tunnel
    # traffic arriving on a different interface -- that failure mode does not apply to loopback,
    # since nginx (host-level, /etc/nginx/sites-available/centinela) always reaches 127.0.0.1
    # regardless of which interface a request actually arrived on. Confirmed live 2026-08-14:
    # centinela.casmart.internal resolves directly to this host, nginx listens on 0.0.0.0:443 and
    # forwards via 127.0.0.1:8301 -- so this port never needed to be reachable from outside
    # localhost. Restricted after confirming this port was directly receiving real exploitation
    # payloads (command injection, XSLT-SSRF RCE) that bypass nginx (and its TLS/security headers)
    # entirely, invisible in nginx's own access.log because they never touch it.
    - 127.0.0.1:8301:5173
    depends_on:
    - centinela-backend
    deploy:
      resources:
        limits:
          memory: 512M
  centinela-sentinel:
    build: .
    container_name: centinela-sentinel
    restart: always
    networks:
    - aura-network
    env_file:
    - .env
    volumes:
    - .:/app
    - /var/run/docker.sock:/var/run/docker.sock
    group_add:
    - "${DOCKER_GID:-136}"
    environment:
    - DB_HOST=${DB_HOST:-10.4.3.23}
    - DB_NAME=${DB_NAME:-centinela_db}
    - DB_USER=${DB_USER:-centinela_user}
    - DB_PASSWORD=${DB_PASSWORD:-centinela_sec_db_2026}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - VAULT_ADDR=${VAULT_ADDR:-http://10.4.3.208:8200}
    - VAULT_TOKEN=${VAULT_TOKEN}
    - ANSIBLE_REMOTE_USER=${ANSIBLE_REMOTE_USER:-pmcp}
    - ANSIBLE_BECOME_PASS=${ANSIBLE_BECOME_PASS:-}
    command: python sentinel.py
    depends_on:
    - centinela-ai
    deploy:
      resources:
        limits:
          memory: 1G

  # ZAP DAST Scanner Cache Volume (for ephemeral container use)
  # Note: ZAP containers are spawned on-demand by auditor_zap.py
  # This volume persists the vulnerability DB to avoid re-download (~100MB)
  # Usage: docker run -v zap-cache:/root/.zap/db owasp/zap2docker-stable
#   ollama:
#     image: ollama/ollama:latest
#     container_name: ollama
#     networks:
#     - aura-network
#     volumes:
#     - ./data/ollama:/root/.ollama
#     deploy:
#       resources:
#         limits:
#           memory: 4G
  falco:
    image: falcosecurity/falco:latest
    container_name: falco
    privileged: true
    restart: always
    volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
    - /dev:/host/dev
    - /proc:/host/proc:ro
    - /boot:/host/boot:ro
    - /lib/modules:/host/lib/modules:ro
    - /usr:/host/usr:ro
    - /etc:/host/etc:ro
    - ./config/falco/falco.yaml:/etc/falco/falco.yaml:ro
    - ./config/falco/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
    # falcosecurity/falco:latest auto-selects the modern eBPF probe (no separate kernel-module
    # load step needed) on kernel >=5.8 -- this host runs 6.8.0, confirmed compatible.
    # http_output.enabled/json_output are set by replacing /etc/falco/falco.yaml outright
    # (./config/falco/falco.yaml is the image's own default file with just those two values
    # changed), not `-o` CLI overrides or a config.d/ snippet. Both of those were tried first and
    # both silently delivered zero events to falcosidekick despite rules firing correctly on
    # stdout (confirmed live via falcosidekick's own logs showing no inbound event). Root cause:
    # Falco's own startup log shows config.d/*.yaml loading BEFORE the main falco.yaml, so the
    # main file's own `http_output.enabled: false` default was applied *after* and silently won
    # over a config.d override -- replacing the file directly is the only override that actually
    # takes effect last.
    command:
    - /usr/bin/falco
    networks:
    - aura-network
    deploy:
      resources:
        limits:
          memory: 512M
  falcosidekick:
    image: falcosecurity/falcosidekick:latest
    container_name: falcosidekick
    restart: always
    environment:
    # Matches the real Valkey instance this whole ecosystem already uses (10.4.3.23, see
    # core/db_manager.py / VALKEY_HOST) -- "casmarts-core-cache" is not a resolvable hostname
    # inside aura-network.
    - REDIS_ADDRESS=10.4.3.23:6379
    # REDIS_STORAGEKEY is set here to document intent, but this falcosidekick build does not
    # actually honor it -- confirmed live that every real event still lands in a plain "falco"
    # list regardless of this value. centinela.py's process_falco_alerts() consumes from "falco"
    # to match the real, observed behavior, not this variable.
    - REDIS_STORAGEKEY=centinela:falco
    networks:
    - aura-network
    deploy:
      resources:
        limits:
          memory: 256M

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.1
    container_name: casmarts-core-wazuh-manager
    hostname: wazuh-manager
    restart: always
    networks:
      - aura-network
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    volumes:
      - wazuh-manager-config:/var/ossec/etc
      - wazuh-manager-data:/var/ossec/var/multigroups
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      - wazuh-manager-agentless:/var/ossec/agentless
      - wazuh-manager-integrations:/var/ossec/integrations
      - wazuh-manager-active-response:/var/ossec/active-response/bin
      - wazuh-manager-api-config:/var/ossec/api/configuration
    deploy:
      resources:
        limits:
          memory: 2G

  centinela-neo4j:
    image: neo4j:5.12.0-community
    container_name: centinela-neo4j
    restart: always
    networks:
      - aura-network
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j-data:/data
    deploy:
      resources:
        limits:
          memory: 1G

  centinela-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: centinela-clickhouse
    restart: always
    networks:
      - aura-network
    # No host port published -- only core/clickhouse_manager.py (running inside
    # centinela-backend/centinela-ai on the same aura-network) needs to reach this, via the
    # container name "centinela-clickhouse" (the module's own default CLICKHOUSE_HOST), matching
    # how centinela-neo4j above is reached.
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 1G

  # SonarQube Community Edition -- real code quality/security analysis for GitLab repos
  # (auditors/auditor_sonarqube.py), separate from the SonarQube instance already running on
  # another server (different DB: centinela_sonarqube_db on 10.4.3.23, not sonarqube_db, to
  # avoid colliding with that unrelated instance). Requires vm.max_map_count>=262144 on the
  # real host for its bundled Elasticsearch -- see .agent/STATE.md / CLAUDE.md for the
  # one-time sysctl step; this service will crash-loop without it.
  centinela-sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: centinela-sonarqube
    restart: always
    networks:
      - aura-network
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://10.4.3.23:5432/centinela_sonarqube_db
      - SONAR_JDBC_USERNAME=${SONARQUBE_DB_USER:-centinela_sonarqube_user}
      - SONAR_JDBC_PASSWORD=${SONARQUBE_DB_PASSWORD}
    # No nproc ulimit here -- confirmed live this is a real Docker footgun, not a SonarQube
    # requirement: RLIMIT_NPROC is accounted per REAL UID at the host kernel level, not
    # per-container/namespace. centinela-ai/-backend/-sentinel already run as uid 1000
    # ("appuser") with thousands of combined threads, and SonarQube's own image also runs
    # as uid 1000 ("sonarqube") -- setting nproc=4096 here collided with that shared,
    # already-exceeded host-wide limit and made the JVM fail to spawn its first thread
    # (posix_spawn EAGAIN) before ever reaching vm.max_map_count/ES startup. Reproduced
    # directly: `docker run --rm -u 1000:1000 --ulimit nproc=4096:4096 busybox sh -c
    # "ulimit -u"` fails identically; the same command without the ulimit override reports
    # "unlimited". nofile is a genuine SonarQube requirement and stays.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    ports:
      # Only for the one-time human bootstrap (password change, token generation) --
      # all container-to-container traffic uses the container name over aura-network, same
      # as centinela-neo4j's 7474 precedent. Coordinate with whoever manages the host
      # firewall to restrict this port to internal/VPN sources, same as already documented
      # for centinela-frontend's published port above.
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 4G

  centinela-zeek:
    image: zeek/zeek:latest
    container_name: centinela-zeek
    restart: always
    networks:
      - aura-network
    cap_add:
      - NET_ADMIN
    volumes:
      - zeek-logs:/usr/local/zeek/logs
    working_dir: /usr/local/zeek/logs
    command: zeek -i eth0
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
  zap-cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=150m"
  neo4j-data:
  clickhouse-data:
  zeek-logs:
  wazuh-manager-config:
  wazuh-manager-data:
  wazuh-manager-logs:
  wazuh-manager-queue:
  wazuh-manager-agentless:
  wazuh-manager-integrations:
  wazuh-manager-active-response:
  wazuh-manager-api-config:

networks:
  aura-network:
    external: true
