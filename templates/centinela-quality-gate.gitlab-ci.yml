# ==============================================================================
# Centinela AI — Plantilla Reutilizable de Quality Gate CI/CD
# Estándares: CMMI v3.0 (CAR/PQA/CM/MC/VV), ISO 27001:2022 (A.8.25/A.8.28), OWASP Top 10
#
# Uso en proyectos (.gitlab-ci.yml):
# ------------------------------------------------------------------------------
# include:
#   - remote: 'http://10.4.3.10:8000/api/templates/gitlab-ci'
#
# stages:
#   - build
#   - test
#   - centinela-security-gate
#   - centinela-compliance
#   - deploy
# ==============================================================================

variables:
  CENTINELA_API_URL: "http://10.4.3.10:8000"
  CENTINELA_BLOCKING_SEVERITY: "HIGH"
  CENTINELA_MIN_CMMI_LEVEL: "2"
  CENTINELA_FAIL_ON_BREACH: "true"

stages:
  - centinela-security-gate
  - centinela-compliance

# ------------------------------------------------------------------------------
# 1. Shift-Left SAST/SCA Quality Gate para Merge Requests
# ------------------------------------------------------------------------------
centinela:mr-security-gate:
  stage: centinela-security-gate
  image: curlimages/curl:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_MERGE_REQUEST_IID'
  script:
    - echo "🛡️ [Centinela AI] Ejecutando Quality Gate de Seguridad en MR !${CI_MERGE_REQUEST_IID}..."
    - >
      RESPONSE=$(curl -s -S -X POST
      "${CENTINELA_API_URL}/api/gitlab/mr-review/${CI_PROJECT_ID}/${CI_MERGE_REQUEST_IID}?blocking_severity=${CENTINELA_BLOCKING_SEVERITY}"
      -H "Content-Type: application/json"
      -H "X-Gitlab-Token: ${CENTINELA_WEBHOOK_TOKEN}"
      --max-time 180)
    - echo "Respuesta Centinela: ${RESPONSE}"
    - echo "${RESPONSE}" > centinela-mr-review-result.json
    - >
      CHECK_STATE=$(echo "${RESPONSE}" | grep -o '"check_state":"[^"]*' | cut -d'"' -f4)
    - >
      FINDINGS_COUNT=$(echo "${RESPONSE}" | grep -o '"findings":[0-9]*' | cut -d':' -f2)
    - echo "Estado del Check: ${CHECK_STATE} | Hallazgos bloqueantes detectados: ${FINDINGS_COUNT}"
    - |
      if [ "${CHECK_STATE}" = "failed" ] && [ "${CENTINELA_FAIL_ON_BREACH}" = "true" ]; then
        echo "❌ [Quality Gate Bloqueado] Se detectaron vulnerabilidades >= ${CENTINELA_BLOCKING_SEVERITY} en las líneas cambiadas de este MR."
        echo "   Revisa los comentarios inline publicados en GitLab o ingresa al panel de Centinela."
        exit 1
      fi
    - echo "✅ [Quality Gate Aprobado] Sin hallazgos bloqueantes en el código introducido."
  artifacts:
    name: "centinela-mr-review-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 7 days
    paths:
      - centinela-mr-review-result.json

# ------------------------------------------------------------------------------
# 2. Compliance Gate CMMI v3.0 & ISO 27001 en Rama Principal / Releases
# ------------------------------------------------------------------------------
centinela:cmmi-iso-quality-gate:
  stage: centinela-compliance
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "📊 [Centinela AI] Evaluando Nivel de Madurez CMMI v3.0 e ISO 27001..."
    - ASSET_NAME="GitLab/${CI_PROJECT_PATH}"
    - ENCODED_ASSET=$(echo -n "${ASSET_NAME}" | jq -sRr @uri)
    - >
      COMPLIANCE_DATA=$(curl -s -S "${CENTINELA_API_URL}/api/audit/cmmi/v3/${ENCODED_ASSET}"
      --max-time 60)
    - echo "${COMPLIANCE_DATA}" > centinela-compliance-data.json
    - >
      MATURITY_LEVEL=$(echo "${COMPLIANCE_DATA}" | jq -r '.cmmi_maturity_level // "Nivel 1 (Initial)"')
    - >
      COMPLIANCE_RATE=$(echo "${COMPLIANCE_DATA}" | jq -r '.cmmi_compliance_percentage // 0')
    - >
      ACTIVE_VULNS=$(echo "${COMPLIANCE_DATA}" | jq -r '.active_vulnerabilities_count // 0')
    - echo "Madurez: ${MATURITY_LEVEL} | Cumplimiento: ${COMPLIANCE_RATE}% | Vulnerabilidades activas: ${ACTIVE_VULNS}"
    - |
      # Descarga de reporte PDF oficial si está disponible
      curl -s -S -o reporte_cumplimiento_cmmi.pdf "${CENTINELA_API_URL}/api/reports/cmmi/${ENCODED_ASSET}" || true
    - |
      if [ "${COMPLIANCE_RATE}" -lt 70 ] && [ "${CENTINELA_FAIL_ON_BREACH}" = "true" ]; then
        echo "⚠️ [Alerta Compliance] El activo ${ASSET_NAME} tiene un cumplimiento CMMI de ${COMPLIANCE_RATE}% (<70%)."
        echo "   Se requiere mitigar hallazgos abiertos antes del paso a producción."
      fi
    - echo "✅ [Compliance Audit Finalizada] Métricas registradas en Centinela SOAR."
  artifacts:
    name: "centinela-cmmi-iso-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 30 days
    paths:
      - centinela-compliance-data.json
      - reporte_cumplimiento_cmmi.pdf
