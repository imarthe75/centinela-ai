server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets: cache for a long time. index.html: never, so a new build is picked up immediately.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;   # SPA fallback (client-side routes survive a reload)
    }
}
