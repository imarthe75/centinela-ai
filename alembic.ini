[alembic]
script_location = database/migrations
# The URL is built in env.py from core.db_manager.DB_CONFIG (same env/Vault contract as the app); nothing is stored here.
sqlalchemy.url =

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
