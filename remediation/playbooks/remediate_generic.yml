---
- name: Centinela-AI Generic Remediation
  hosts: all
  become: yes
  vars:
    script_content: ""
    script_name: "remediation.sh"
  
  tasks:
    - name: Create temporary remediation script
      copy:
        content: "{{ script_content }}"
        dest: "/tmp/{{ script_name }}"
        mode: '0755'

    - name: Execute remediation script
      shell: "/tmp/{{ script_name }}"
      register: script_output
      ignore_errors: yes

    - name: Cleanup remediation script
      file:
        path: "/tmp/{{ script_name }}"
        state: absent

    - name: Report execution status
      debug:
        msg: "Remediation executed. Return code: {{ script_output.rc }}"
