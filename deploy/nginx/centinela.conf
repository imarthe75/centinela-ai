# Centinela-AI reverse proxy.
# Autonomous deploy 2026-09-07. server_name is a catch-all until the real public
# FQDN is set (then `certbot --nginx -d <fqdn>` adds the 443 server + HTTP->HTTPS
# redirect automatically).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;

    # Let's Encrypt HTTP-01 challenge (certbot --nginx also handles this, kept explicit)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Backend REST API + WebSocket alerts
    location /api/ {
        proxy_pass http://127.0.0.1:8302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Frontend (Vite dev server). Host forced to localhost so Vite's allowedHosts
    # check never rejects proxied traffic regardless of the public FQDN.
    location / {
        proxy_pass http://127.0.0.1:8301;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
